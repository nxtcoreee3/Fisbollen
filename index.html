<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fisbollen</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f3b1d;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.screen {
    width: 320px;
    height: 600px;
    background: #cfcfcf;
    position: relative;
    display: none;
    overflow: hidden;
}

.screen.active {
    display: block;
}

header, footer {
    height: 60px;
    background: black;
}

header.red, footer.red {
    background: red;
}

video {
    width: 100%;
    height: calc(100% - 120px);
    object-fit: cover;
}

button {
    background: red;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 14px 36px;
    font-size: 18px;
    cursor: pointer;
}

.center-btn {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
}

.overlay {
    position: absolute;
    top: 200px;
    width: 100%;
    text-align: center;
    font-size: 36px;
    font-weight: bold;
}

.badges {
    position: absolute;
    top: 70px;
    right: 10px;
    display: flex;
    gap: 8px;
}

.badge {
    background: #999;
    color: white;
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 14px;
}

#passwordScreen {
    background: #222;
    color: white;
    padding: 20px;
    text-align: center;
}

input {
    padding: 10px;
    font-size: 16px;
    width: 80%;
    margin-top: 20px;
}

.end-buttons {
    position: absolute;
    bottom: 60px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 10px;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div id="passwordScreen" class="screen active">
    <h2>Fisbollen</h2>
    <p>Enter password</p>
    <input id="passwordInput" type="password" placeholder="Password">
    <br><br>
    <button onclick="checkPassword()">Enter</button>
</div>

<!-- START -->
<div id="startScreen" class="screen">
    <header></header>
    <video id="preview" autoplay muted playsinline></video>
    <button class="center-btn" onclick="startCountdown()">Start</button>
    <footer></footer>
</div>

<!-- DURING -->
<div id="duringScreen" class="screen">
    <header class="red"></header>
    <video id="recording" autoplay muted playsinline></video>

    <div class="badges">
        <div class="badge">💨 <span id="fartCount">0</span></div>
        <div class="badge" id="timeLeft">00:15</div>
    </div>

    <div class="overlay" id="countdownText"></div>
    <button class="center-btn" onclick="stopRecording()">Stop</button>
    <footer class="red"></footer>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <video id="playback" controls></video>

    <div class="end-buttons">
        <button onclick="downloadVideo()">Download</button>
        <button onclick="restart()">Restart</button>
    </div>
</div>

<script>
let stream, mediaRecorder, audioContext, analyser;
let chunks = [];
let detecting = false;
let duration = 15;
let timer;
let fartCounter = 0;
let lastFartTime = 0;

/* ---------- PASSWORD ---------- */
async function checkPassword() {
    if (passwordInput.value === "jagfes") {
        showScreen(startScreen);
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        preview.srcObject = stream;
    } else {
        alert("Wrong password");
    }
}

/* ---------- COUNTDOWN ---------- */
function startCountdown() {
    showScreen(duringScreen);
    recording.srcObject = stream;
    fartCounter = 0;
    fartCount.textContent = "0";

    let count = 3;
    countdownText.textContent = count;

    const interval = setInterval(() => {
        count--;
        if (count > 0) {
            countdownText.textContent = count;
        } else {
            clearInterval(interval);
            countdownText.textContent = "GO!";
            setTimeout(() => countdownText.textContent = "", 500);
            startRecording();
        }
    }, 1000);
}

/* ---------- RECORDING ---------- */
function startRecording() {
    chunks = [];

    mediaRecorder = new MediaRecorder(stream, {
        mimeType: "video/webm;codecs=vp8,opus"
    });

    mediaRecorder.start();

    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = saveVideo;

    startTimer();
    startAudioDetection();
}

/* ---------- LOW SENSITIVITY DETECTION ---------- */
function startAudioDetection() {
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    const mic = audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);
    detecting = true;

    function detect() {
        if (!detecting) return;

        analyser.getByteFrequencyData(data);
        let volume = data.reduce((a, b) => a + b) / data.length;

        const now = Date.now();

        // 🔧 VERY LOW SENSITIVITY (raise number = harder)
        if (volume > 90 && now - lastFartTime > 1500) {
            fartCounter++;
            fartCount.textContent = fartCounter;
            lastFartTime = now;
        }

        requestAnimationFrame(detect);
    }
    detect();
}

/* ---------- TIMER ---------- */
function startTimer() {
    let time = duration;
    timeLeft.textContent = "00:15";

    timer = setInterval(() => {
        time--;
        timeLeft.textContent = `00:${time < 10 ? "0" + time : time}`;
        if (time <= 0) stopRecording();
    }, 1000);
}

function stopRecording() {
    if (!mediaRecorder || mediaRecorder.state !== "recording") return;
    detecting = false;
    clearInterval(timer);
    mediaRecorder.stop();
}

/* ---------- SAVE ---------- */
function saveVideo() {
    const blob = new Blob(chunks, { type: "video/mp4" });
    playback.src = URL.createObjectURL(blob);
    playback.blob = blob;
    showScreen(endScreen);
}

function downloadVideo() {
    const a = document.createElement("a");
    a.href = playback.src;
    a.download = "fisbollen.mp4";
    a.click();
}

/* ---------- RESTART ---------- */
function restart() {
    playback.pause();
    playback.src = "";
    showScreen(startScreen);
}

/* ---------- UI ---------- */
function showScreen(screen) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    screen.classList.add("active");
}
</script>

</body>
</html>
