<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fisbollen</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    background: black;
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    overflow: hidden;
}

/* APP */
.app {
    position: fixed;
    inset: 0;
    background: black;
}

/* SCREENS */
.screen {
    position: absolute;
    inset: 0;
    display: none;
}

.screen.active {
    display: block;
}

/* TOP BAR */
.topbar {
    height: 80px;
    background: black;
    padding-top: env(safe-area-inset-top);
}

.topbar.red {
    background: red;
}

/* VIDEO */
video {
    width: 100%;
    height: calc(100% - 200px);
    object-fit: cover;
    background: black;
}

/* OVERLAY COUNTERS */
.overlay {
    position: absolute;
    top: 120px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 10;
}

.overlay div {
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
}

/* COUNTDOWN */
.countdown {
    position: absolute;
    top: 45%;
    width: 100%;
    text-align: center;
    font-size: 48px;
    font-weight: 800;
    color: white;
}

/* BUTTON */
.big-btn {
    position: absolute;
    bottom: env(safe-area-inset-bottom, 30px);
    left: 50%;
    transform: translateX(-50%);
    background: white;
    color: black;
    font-size: 28px;
    font-weight: 800;
    border-radius: 999px;
    padding: 18px 70px;
    border: none;
}

.big-btn.red {
    background: red;
    color: white;
}

/* PASSWORD */
#passwordScreen {
    background: black;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#passwordScreen input {
    padding: 14px;
    font-size: 18px;
    border-radius: 10px;
    border: none;
    margin: 16px 0;
    width: 70%;
}

/* END BUTTONS */
.end-buttons {
    position: absolute;
    bottom: env(safe-area-inset-bottom, 30px);
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 14px;
}
</style>
</head>

<body>
<div class="app">

<!-- PASSWORD -->
<div id="passwordScreen" class="screen active">
    <h1>Fisbollen</h1>
    <input id="passwordInput" type="password" placeholder="Password">
    <button class="big-btn" onclick="checkPassword()">START</button>
</div>

<!-- START -->
<div id="startScreen" class="screen">
    <div class="topbar"></div>
    <video id="preview" autoplay muted playsinline></video>
    <button class="big-btn" onclick="startCountdown()">START</button>
</div>

<!-- DURING -->
<div id="duringScreen" class="screen">
    <div class="topbar red"></div>

    <video id="recording" autoplay muted playsinline></video>

    <div class="overlay">
        <div>💨 <span id="fartCount">0</span></div>
        <div id="timeLeft">00:10</div>
    </div>

    <div class="countdown" id="countdownText"></div>

    <button class="big-btn red" onclick="stopRecording()">STOP</button>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <video id="playback" controls playsinline></video>
    <div class="end-buttons">
        <button class="big-btn red" onclick="downloadVideo()">SAVE</button>
        <button class="big-btn" onclick="restart()">RETRY</button>
    </div>
</div>

</div>

<script>
let stream, mediaRecorder, audioContext, analyser;
let chunks = [];
let fartCounter = 0;
let lastFartTime = 0;
let detecting = false;
let timer;
const duration = 10;

/* PASSWORD */
async function checkPassword() {
    if (passwordInput.value !== "jagfes") return alert("Wrong password");
    stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user" },
        audio: true
    });
    preview.srcObject = stream;
    showScreen(startScreen);
}

/* COUNTDOWN */
function startCountdown() {
    showScreen(duringScreen);
    recording.srcObject = stream;
    fartCounter = 0;
    fartCount.textContent = "0";

    let c = 3;
    countdownText.textContent = c;

    const i = setInterval(() => {
        c--;
        if (c > 0) countdownText.textContent = c;
        else {
            clearInterval(i);
            countdownText.textContent = "GO";
            setTimeout(() => countdownText.textContent = "", 500);
            startRecording();
        }
    }, 1000);
}

/* RECORD */
function startRecording() {
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.start();
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = saveVideo;

    startTimer();
    startDetection();
}

/* MULTI FART DETECTION */
function startDetection() {
    audioContext = new AudioContext();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;

    const mic = audioContext.createMediaStreamSource(stream);
    mic.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);
    detecting = true;

    function detect() {
        if (!detecting) return;
        analyser.getByteFrequencyData(data);

        let volume = data.reduce((a,b)=>a+b) / data.length;
        const now = Date.now();

        // 🔧 tuned for multiple obvious farts
        if (volume > 75 && now - lastFartTime > 500) {
            fartCounter++;
            fartCount.textContent = fartCounter;
            lastFartTime = now;
        }

        requestAnimationFrame(detect);
    }
    detect();
}

/* TIMER */
function startTimer() {
    let t = duration;
    timeLeft.textContent = "00:10";
    timer = setInterval(() => {
        t--;
        timeLeft.textContent = `00:${t < 10 ? "0"+t : t}`;
        if (t <= 0) stopRecording();
    }, 1000);
}

function stopRecording() {
    if (!mediaRecorder || mediaRecorder.state !== "recording") return;
    detecting = false;
    clearInterval(timer);
    mediaRecorder.stop();
}

/* SAVE */
function saveVideo() {
    const blob = new Blob(chunks, { type: "video/mp4" });
    playback.src = URL.createObjectURL(blob);
    showScreen(endScreen);
}

function downloadVideo() {
    const a = document.createElement("a");
    a.href = playback.src;
    a.download = "fisbollen.mp4";
    a.click();
}

/* RESTART */
function restart() {
    playback.src = "";
    showScreen(startScreen);
}

/* UI */
function showScreen(s) {
    document.querySelectorAll(".screen").forEach(x => x.classList.remove("active"));
    s.classList.add("active");
}
</script>
</body>
</html>
